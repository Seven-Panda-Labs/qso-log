name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: npm run check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The application scaffold is not committed yet. Until package.json
      # exists, the steps below are skipped instead of failing every PR.
      - name: Detect app scaffold
        id: scaffold
        run: |
          if [ -f package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No package.json yet, skipping build and tests."
          fi

      - name: Setup Node.js
        if: steps.scaffold.outputs.present == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        if: steps.scaffold.outputs.present == 'true'
        run: npm ci

      - name: Typecheck, lint, test, verify changelog
        if: steps.scaffold.outputs.present == 'true'
        run: npm run check
