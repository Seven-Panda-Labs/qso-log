name: Secret scan

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: secret-scan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep in sync with minVersion in .gitleaks.toml.
  GITLEAKS_VERSION: 8.30.1

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The gitleaks binary rather than gitleaks-action: no license key for
      # organizations, current version, and no Node deprecation warnings.
      - name: Install gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks

      - name: Scan history
        run: gitleaks git . --redact --no-banner --exit-code 1 --verbose
